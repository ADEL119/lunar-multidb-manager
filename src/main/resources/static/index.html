<!-- Backup Panel Section -->
<div id="backupPanel" class="container bg-light bg-opacity-75 p-5 rounded-4 shadow d-none">
    <h2 class="text-center mb-4 text-primary fw-bold d-flex justify-content-center align-items-center gap-2">
        <i class="bi bi-shield-lock-fill"></i> Backup Control Panel
    </h2>
    <div class="row">
        <div class="col-md-5">
            <form onsubmit="scheduleBackup(event)" class="d-flex flex-column gap-3">
                <div>
                    <label for="cronExpression" class="form-label fw-bold">Cron Expression</label>
                    <input type="text" class="form-control" id="cronExpression" placeholder="e.g. 0 0/5 * * * ?" required>
                    <small><a href="https://www.freeformatter.com/cron-expression-generator-quartz.html#crongenerator" target="_blank">Need help with cron?</a></small>
                </div>
                <div>
                    <label for="frequencyLabel" class="form-label fw-bold">Frequency Label</label>
                    <input type="text" class="form-control" id="frequencyLabel" placeholder="e.g. manual" required>
                </div>
                <div>
                    <button type="submit" class="btn btn-dark w-100 btn-sm-custom">Schedule</button>
                </div>
            </form>
        </div>
        <div class="col-md-1 d-flex justify-content-center">
            <div class="divider"></div>
        </div>
        <div class="col-md-6 d-flex flex-column justify-content-center gap-4 align-items-center">
            <button id="backupNowBtn" onclick="triggerBackupNow()" class="btn btn-primary w-75 btn-sm-custom d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-play-circle"></i> Backup Now
            </button>
            <button onclick="toggleReportTable()" class="btn btn-outline-dark w-75 btn-sm-custom d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-journal-text"></i> View Backup Reports
            </button>
        </div>
    </div>
    <div id="reportSection" class="d-none mt-5">
        <h4 class="text-center mb-3">Backup Reports</h4>
        <div class="table-responsive">
            <table id="reportTable" class="table table-hover table-bordered text-center">
                <thead class="table-dark">
                <tr>
                    <th>Database</th>
                    <th>Type</th>
                    <th>Frequency</th>
                    <th>Status</th>
                    <th>File</th>
                    <th>Timestamp</th>
                </tr>
                </thead>
                <tbody id="reportTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Restore Panel Section -->
<div id="restorePanel" class="container bg-light bg-opacity-75 p-5 rounded-4 shadow d-none">
    <h2 class="text-center mb-4 text-warning-emphasis fw-bold d-flex justify-content-center align-items-center gap-2">
        <i class="bi bi-arrow-clockwise fs-3"></i> Restore Control Panel
    </h2>

    <div class="table-responsive mt-4">
        <table id="restoreTable" class="table table-bordered table-hover table-striped align-middle text-center shadow-sm">
            <thead class="table-warning text-dark fw-semibold">
            <tr class="text-uppercase">
                <th scope="col">Type</th>
                <th scope="col">Database Name</th>
                <th scope="col">Host</th>
                <th scope="col">Port</th>
                <th scope="col">Username</th>
                <th scope="col">Password</th>
                <th scope="col">Data Source</th>
                <th scope="col">Action</th>
            </tr>
            </thead>
            <tbody id="restoreTableBody" class="table-group-divider"></tbody>
        </table>
    </div>
</div>


<!-- Global Config Panel -->
<div id="configPanel" class="container bg-light bg-opacity-75 p-5 rounded-4 shadow mt-5 d-none">
    <h2 class="text-center mb-4 text-success fw-bold d-flex justify-content-center align-items-center gap-2">
        <i class="bi bi-gear-fill"></i> Configuration Panel
    </h2>


    <form id="configForm" onsubmit="submitGlobalConfig(event)" class="row g-3">
        <div class="col-md-6">
            <label class="form-label fw-bold">Backup Path</label>
            <input type="text" class="form-control" id="pathDirectory" placeholder="/path/to/backup">
        </div>

        <div class="col-md-6">
            <label class="form-label fw-bold">Notification Email From</label>
            <input type="email" class="form-control" id="notificationEmailFrom">
        </div>

        <div class="col-md-6">
            <label class="form-label fw-bold">Notification Password</label>
            <input type="password" class="form-control" id="notificationEmailPassword">
        </div>

        <div class="col-md-6">
            <label class="form-label fw-bold">SMTP Host</label>
            <input type="text" class="form-control" id="notificationSmtpHost">
        </div>

        <div class="col-md-4">
            <label class="form-label fw-bold">SMTP Port</label>
            <input type="number" class="form-control" id="notificationSmtpPort">
        </div>

        <div class="col-md-4">
            <label class="form-label fw-bold">SMTP Auth</label>
            <select class="form-select" id="notificationSmtpAuth">
                <option value="true">True</option>
                <option value="false">False</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label fw-bold">StartTLS</label>
            <select class="form-select" id="notificationStartTlsEnable">
                <option value="true">True</option>
                <option value="false">False</option>
            </select>
        </div>

        <div class="col-12">
            <label class="form-label fw-bold">Summary Email Recipients (comma separated)</label>
            <input type="text" class="form-control" id="notificationSummaryEmailToList">
        </div>

        <!-- START: DB Config List Display -->
        <div class="col-12 mt-4">
            <h4 class="fw-bold text-primary">Configured Databases</h4>
            <div class="col-12 d-flex justify-content-end mb-3">
                <button type="button" class="btn btn-outline-primary" onclick="addNewDatabase()">
                    <i class="bi bi-plus-circle"></i> Add New Database
                </button>
            </div>
            <div id="dbConfigList" class="row row-cols-1 row-cols-md-2 g-4"></div>
        </div>
        <!-- END: DB Config List Display -->


        <div class="col-12">
            <button type="submit" class="btn btn-success w-100">
                <i class="bi bi-save"></i> Save Configuration
            </button>
        </div>
    </form>
</div>

<!-- Footer -->
<footer class="bg-light text-center text-muted py-3 shadow-sm mt-5">
    <small>© 2025 LunFlow. All rights reserved.</small>
</footer>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="js/app.js"></script>
<!-- New Database Modal -->
<div class="modal fade" id="newDatabaseModal" tabindex="-1" aria-labelledby="newDatabaseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="newDatabaseForm" onsubmit="handleNewDatabaseSubmit(event)">
                <div class="modal-header">
                    <h5 class="modal-title" id="newDatabaseModalLabel">Add New Database</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Type</label>
                        <input type="text" class="form-control" id="dbType" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Database</label>
                        <input type="text" class="form-control" id="dbName" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Host</label>
                        <input type="text" class="form-control" id="dbHost" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Port</label>
                        <input type="number" class="form-control" id="dbPort" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" id="dbUsername">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Password</label>
                        <input type="text" class="form-control" id="dbPassword">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Authentication DB</label>
                        <input type="text" class="form-control" id="dbAuthDB">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Short Name</label>
                        <input type="text" class="form-control" id="dbShortName">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Email List (comma-separated)</label>
                        <input type="text" class="form-control" id="dbEmailList">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Daily</label>
                        <select class="form-select" id="dbDaily">
                            <option value="true">True</option>
                            <option value="false">False</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Weekly</label>
                        <select class="form-select" id="dbWeekly">
                            <option value="true">True</option>
                            <option value="false">False</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Monthly</label>
                        <select class="form-select" id="dbMonthly">
                            <option value="true">True</option>
                            <option value="false">False</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Large Collections (comma-separated)</label>
                        <input type="text" class="form-control" id="dbLargeCollections">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Backup Large Collections</label>
                        <select class="form-select" id="dbBackupLargeCollections">
                            <option value="true">True</option>
                            <option value="false">False</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle"></i> Add Database
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- Toast Container (top-center) -->
<div class="toast-container">
    <div id="backupToast" class="toast align-items-center text-white bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>
